name: Check framing router
on:
  push:
    paths:
      - 'router/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/frame-validation.yml'
  pull_request:
    paths:
      - 'router/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/frame-validation.yml'
  workflow_dispatch:

jobs:
  validate-router:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python router and tests
        run: python -m compileall -q scripts tests
      - name: Run router regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify JSON document syntax
        run: |
          python -m json.tool router/router.v1.json > /dev/null
          python -m json.tool router/run.schema.json > /dev/null
          python -m json.tool router/pef-questions.schema.json > /dev/null
          python -m json.tool router/pef-experience.schema.json > /dev/null
          python -m json.tool examples/acs-version-b.questions.json > /dev/null
          python -m json.tool examples/acs-version-b.experience.draft.json > /dev/null
          python -m json.tool examples/acs-version-b.run.json > /dev/null
      - name: Validate run against JSON Schema
        run: |
          python -m pip install 'jsonschema>=4.20,<5'
          python -c "import json; from jsonschema import Draft202012Validator; s=json.load(open('router/run.schema.json')); x=json.load(open('examples/acs-version-b.run.json')); Draft202012Validator.check_schema(s); Draft202012Validator(s).validate(x); print('Schema PASS')"
      - name: Check PEF QA schema and draft packet
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          for schema_path, example_path in [
            ('router/pef-questions.schema.json', 'examples/acs-version-b.questions.json')
          ]:
            s = json.load(open(schema_path))
            Draft202012Validator.check_schema(s)
            Draft202012Validator(s).validate(json.load(open(example_path)))
          s = json.load(open('router/pef-experience.schema.json'))
          Draft202012Validator.check_schema(s)
          draft = json.load(open('examples/acs-version-b.experience.draft.json'))
          Draft202012Validator(s).validate(draft)
          assert draft['review']['status'] == 'draft'
          assert draft['cta']['behavior_verified'] is False
          print('PEF JSON schema PASS; B experience draft remains unapproved')
          PY
          python scripts/pef.py validate-qa examples/acs-version-b.run.json examples/acs-version-b.questions.json
          python scripts/pef.py questions examples/acs-version-b.run.json examples/acs-version-b.questions.json > /tmp/pef-owner-review.json
          python -m json.tool /tmp/pef-owner-review.json > /dev/null
      - name: Assert drafts cannot compile ABA
        run: |
          python - <<'PY'
          import json
          q = json.load(open('/tmp/pef-owner-review.json'))
          assert q['blocking_total'] == 1
          assert [x['id'] for x in q['questions']] == ['Q3']
          print('Audience and benefit direction accepted; only unresolved Q3 CTA remains')
          PY
          python - <<'PY'
          import subprocess
          args=['python','scripts/pef.py','check-brief',
            'examples/acs-version-b.run.json',
            'examples/acs-version-b.questions.json',
            'examples/acs-version-b.experience.draft.json']
          result = subprocess.run(args,capture_output=True,text=True)
          assert result.returncode != 0, 'Draft was incorrectly accepted for ABA'
          assert 'Cannot send to ABA' in result.stderr or 'Blocking owner QA' in result.stderr
          print('Expected fail-closed check PASS: ABA cannot receive unapproved ACS B')
          PY
      - name: Validate draft ACS-B run record
        run: python scripts/frame.py validate examples/acs-version-b.run.json
      - name: Ensure context packet is bounded
        run: python scripts/frame.py pack examples/acs-version-b.run.json > /tmp/frame-packet.json
